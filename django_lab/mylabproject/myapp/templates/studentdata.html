<!DOCTYPE html>
<html>
    <head>
        <title>Lab 9 qn 2</title>
    </head>
    <body>
        <table>
            <tr>
                <th>Name</th>
                <th>Faculty</th>
                <th>Roll</th>
                <th>Address</th>
            </tr>
            {% for student in students %}
            <tr>
                <td>{{student.name}}</td>
                <td>{{student.faculty}}</td>
                <td>{{student.roll}}</td>
                <td>{{student.address}}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No student found</td>
            </tr>
            {% endfor%}
        </table>
        <br>
        <a href="/admin/">Go to Admin Panel</a>
    </body>
</html>
