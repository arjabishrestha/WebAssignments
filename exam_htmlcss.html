<!DOCTYPE html>
<html>
    <head>
        <title>Form</title>
        <link rel="stylesheet" href="examstyle.css">
    </head>
    <body>
        <header>
            <h1>Form</h1>
        </header>
        <main>
            <form action="submit.php" method="get">
                <label for="name">Full Name</label>
                <input type="name" id="name" placeholder="Enter your name" name="name">
                <br>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter email id">
                <br>
                <label for="pw">Password</label>
                <input type="password" id="pw" name="password">
                <br>
                <label for="pw">Confirm Password</label>
                <input type="password" id="pw" name="confirmpw">
                <br>
                <fieldset>
                    <legend>Gender</legend><br>
                    <input type="radio" name="gender" value="male">Male
                    <input type="radio" name="gender" value="female">Female
                    <input type="radio" name="gender" value="notsay">Prefer not to say
                </fieldset><br>
                <fieldset>
                    <legend>Skills</legend><br>
                    <input type="checkbox" name="skills" value="html">HTML
                    <input type="checkbox" name="skills" value="css">CSS
                    <input type="checkbox" name="skills" value="js">JS
                    <input type="checkbox" name="skills" value="django">Django
                </fieldset><br>
                <label for="prg">Program</label><br>
                <select id="prg" name="program">
                    <option value="bct">BCT</option>
                    <option value="bei">BEI</option>
                    <option value="bex">BEX</option>
                </select><br>
                <label>Address</label>
                <textarea rows="1" cols="80"></textarea><br>
                <input type="submit" id="submit"><br>
            </form>

        </main>
