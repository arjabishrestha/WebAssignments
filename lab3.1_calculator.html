<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function add()
        {
            let a=document.getElementById('n1').value;
            let b=document.getElementById('n2').value;
            let res=document.getElementById('result');
            if (a===""|| b==="")
                res.innerHTML=("Please enter both numbers");
            else
                res.innerHTML=`Result:${Number(a)+Number(b)}`;
        }
        function sub()
        {
            let a=document.getElementById('n1').value;
            let b=document.getElementById('n2').value;
            let res=document.getElementById('result');
            if (a===""|| b==="")
                res.innerHTML=("Please enter both numbers");
            else
                res.innerHTML=`Result:${Number(a)-Number(b)}`;
        }
    </script>
</head>
<body>
    <div>
        <label>Insert first number</label>
        <input type="number" id="n1"><br><br>
        <label>Insert second number</label>
        <input type="number" id="n2"><br><br>
        <button onclick="add()">add</button>
        <button onclick="sub()">subtract</button>
        <p id="result">The result is</p>
    </div>
</body>
</html>
