<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM MANIPULATION</title>
    <script>
        function changetext(){
            let para=document.getElementById("orgipara");
            para.innerHTML=document.getElementById("newpara").value;
        }
        function changesize(){
            let para=document.getElementById("orgipara");
            para.style.fontSize="50px";
        }
        function changecol(){
            let para=document.getElementById("orgipara");
            if(para.style.color==='black')
                para.style.color='red'
            else
                para.style.color='black'
        }
    </script>
</head>
<body>
    <h2>DOM Manipulation & Style Changer</h2>
    <p id="orgipara">WELCOME TO JAVASCRIPT LAB </p>
    <label>Enter text</label>
    <input type="text" id="newpara"><br><br>
    <button onclick="changetext()">Change text</button>
    <button onclick="changecol()">Change color</button>
    <button onclick="changesize()">Change font size</button>
</body>
</html>
