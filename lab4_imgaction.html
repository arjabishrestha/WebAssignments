<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image With Description</title>
</head>
<body>
    <h1>My image</h1>
    <div>
        <img id="image" src="images/ssphoto.png">
        <p id="description">Hover in this image to know about the image.</p>
        <script>
            let original = document.getElementById("description").innerHTML
            document.getElementById("image").onmouseover=function(){
                document.getElementById("description").innerHTML="This image is the logo of KEC.";
            }
            document.getElementById("image").onmouseout=function(){
                document.getElementById("description").innerHTML=original
            }
        </script>
    </div>
</body>
</html>
